nav.main{display:none;gap:4px;margin-inline-start:auto}
nav.main a{color:#c9cfdc;text-decoration:none;font-weight:700;font-size:14px;padding:8px 12px;border-radius:10px}
nav.main a:hover,nav.main a.on{background:rgba(255,255,255,.1);color:#fff}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;margin-inline-start:auto}

.lang button.on{background:#fff;color:var(--navy)}

.hero{background:radial-gradient(70% 90% at 100% 0%,rgba(240,122,26,.38),transparent 60%),linear-gradient(165deg,#1d2236,#141826);color:#fff;padding:56px 0 96px;overflow:hidden}

.hero p{color:#c9cfdc;font-size:17px;max-width:46ch;margin-top:16px}

.shelf{display:none}
@media(min-width:900px){.hero .wrap{grid-template-columns:1.1fr .9fr}.shelf{display:flex;justify-content:center;align-items:flex-end}

.shelf span:nth-child(2){transform:translateY(-26px);z-index:2;width:228px}
.shelf img{width:84%;height:84%;object-fit:contain}}
.hero.sm{padding:40px 0 80px}.hero.sm .wrap{grid-template-columns:1fr}.hero.sm h1{max-width:20ch;font-size:clamp(30px,5vw,48px)}

main{margin-top:-52px;position:relative;padding-bottom:40px}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:900px){.groups{grid-template-columns:repeat(4,1fr)}}
.gc{display:flex;flex-direction:column;gap:10px;text-decoration:none;background:var(--card);border-radius:var(--r);padding:20px;min-height:170px;border-top:5px solid var(--gc);box-shadow:0 14px 34px rgba(20,24,38,.12);transition:transform .2s}

.bar h2{font-size:22px;font-weight:900;margin-inline-end:auto}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:100%}

.thumb b{font-size:34px;font-weight:900;color:#161a24;direction:ltr}

footer{background:var(--navy);color:#9aa3b8;padding:36px 0 calc(36px + env(safe-area-inset-bottom));font-size:14px;line-height:1.7}
footer img{height:34px;margin-bottom:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}

  $('others').innerHTML=GROUPS.filter(x=>x.slug!==GROUP).map(x=>`<a href="${PFX}${x.slug}/"><img src="${PFX}img/gamme-${x.slug}.svg" alt="">${x[L]}</a>`).join('');}
 else{$('h1').textContent=t.title;$('sub').textContent=t.sub;$('others').style.display='none';
  $('groups').innerHTML=GROUPS.map(g=>`<a class="gc" href="${g.slug}/" style="--gc:${g.c}"><img src="img/gamme-${g.slug}.svg" alt=""><b>${g[L]}</b><small>${t.n(count(g.slug))}</small></a>`).join('');
  $('filters').innerHTML=['all',...GROUPS.filter(g=>count(g.slug)).map(g=>g.slug)].map(s=>`<button data-c="${s}" class="${s===F?'on':''}">${s==='all'?t.all:G(s)[L]}</button>`).join('');
  document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{F=b.dataset.c;render()});
  $('shelf').innerHTML=PRODUCTS.filter(p=>p.img&&p.cut&&!p.soon).slice(0,3).map(p=>`<span style="background:${p.c}"><img src="${p.img}" alt=""></span>`).join('');}
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));draw();
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('lang',L)}catch(e){}render()});
$('q').addEventListener('input',draw);render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register(PFX+'sw.js').catch(()=>{}));
</script>
