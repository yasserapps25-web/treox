<style>
:root{--c:#f6a68c;--c2:#a8452a;--ink:#161a24;--ink2:#4a5263;--muted:#7a8396;--bg:#f4f5f8;--card:#fff;--line:#e3e6ee;--accent:#f07a1a;--shadow:0 6px 24px rgba(20,24,38,.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#eef0f6;--ink2:#c3c9d6;--muted:#8d95a8;--bg:#0c0f18;--card:#171b28;--line:#262c3d;--shadow:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--ink:#eef0f6;--ink2:#c3c9d6;--muted:#8d95a8;--bg:#0c0f18;--card:#171b28;--line:#262c3d;--shadow:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
.band{background:var(--c);color:#161a24;padding:calc(12px + env(safe-area-inset-top)) 16px 54px;border-end-end-radius:56px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 100% 0%,rgba(255,255,255,.45),transparent 60%);pointer-events:none}
.band > *{position:relative;z-index:1}
.bar{display:flex;justify-content:space-between;align-items:center}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:800;font-size:14px;background:rgba(255,255,255,.55);padding:8px 12px 8px 8px;border-radius:12px}
.back svg{width:18px;height:18px}
[dir="rtl"] .back svg{transform:scaleX(-1)}
.lang{display:flex;background:rgba(255,255,255,.55);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:#161a24;font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button.on{background:#161a24;color:#fff}
.names{text-align:center;margin-top:30px}
.names h1{font-size:36px;line-height:1.1;font-weight:500;letter-spacing:.01em;direction:ltr}
.names h1 sup{font-size:.45em;vertical-align:1em}
.names h1 b{font-weight:800}
.names .ar{font-size:28px;margin-top:4px;font-family:"Noto Sans Arabic",Tahoma,sans-serif;direction:rtl}
main{max-width:640px;margin:0 auto;padding:0 16px 32px}
.sub{text-align:center;margin:26px 0 6px;font-size:17px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
[dir="rtl"] .sub{text-transform:none;letter-spacing:0}
.sub2{text-align:center;font-size:17px;color:var(--ink2);font-family:"Noto Sans Arabic",Tahoma,sans-serif;direction:rtl}
.soon{margin:26px 0 0;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:20px;text-align:center;border-top:4px solid var(--c)}
.soon .ico{width:52px;height:52px;margin:0 auto 10px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#161a24}
.soon .ico svg{width:26px;height:26px}
.soon h2{font-size:18px}
.soon p{font-size:14.5px;color:var(--muted);margin-top:4px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:800;font-size:14px;padding:13px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.wide{grid-column:1/-1}
.btn svg{width:18px;height:18px;flex:none}
.dist{display:flex;align-items:center;gap:12px;margin-top:22px;background:#141826;color:#c9cfdc;border-radius:16px;padding:14px;font-size:13px}
.dist img{height:26px;width:auto;flex:none}
.cat{display:block;text-align:center;margin-top:18px;font-weight:800;color:var(--c2);text-decoration:none;font-size:15px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cat{color:var(--c)}}
:root[data-theme="dark"] .cat{color:var(--c)}
footer{text-align:center;font-size:12px;color:var(--muted);padding:12px 16px 24px}

.contact img{height:46px!important;width:auto}
.dist img{height:34px!important;width:auto}
.contact p{line-height:1.55}
.dist{flex-direction:column;align-items:flex-start}
</style>
</head>
