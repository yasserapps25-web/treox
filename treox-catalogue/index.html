const T={fr:{title:'L\'hygiène professionnelle, fabriquée à Constantine.',sub:'TREOX Algérie produit des désinfectants et des détergents pour la santé, l\'industrie, l\'élevage et la maison.',c1:'Voir les gammes',c2:'Chercher un produit',prods:'produits',gam:'gammes',lg:'langues',t1:'Quatre gammes, un même niveau d\'exigence',l1:'Chaque gamme répond à un métier précis. Ouvrez-en une pour accéder aux fiches techniques de ses produits.',go:'Voir la gamme',t2:'Tout le catalogue',ph:'Rechercher un produit…',all:'Toutes les gammes',empty:'<b>Aucun produit trouvé</b>Essayez un autre nom ou une autre gamme.',soon:'Fiche bientôt disponible',t3:'Fabriqué en Algérie, expliqué en toutes lettres',a1:'SARL TREOX ALGÉRIE produit des désinfectants et des détergents depuis Constantine. Ce catalogue réunit les fiches techniques de ses produits, gamme par gamme.',a2:'Chaque fiche est disponible en français et en arabe, et s\'ouvre directement depuis le QR code présent sur l\'emballage.',t4:'Une question sur un produit ?',a3:'Écrivez-nous ou visitez notre site pour toute demande d\'information.',n:k=>k?k+' produit'+(k>1?'s':''):'Bientôt disponible',dist:'SARL TREOX ALGÉRIE — Production des produits désinfectants et détergents.<br>Cité El Yasmine, Aïn El Bey, DNC N° 118, Constantine, Algérie.<br><span dir="ltr">treox.info@treoxalgerie.com · www.treoxalgerie.com</span>'},
ar:{title:'النظافة المهنية، صُنعت في قسنطينة.',sub:'تنتج تريوكس الجزائر المطهرات والمنظفات لقطاعات الصحة والصناعة وتربية الحيوانات والمنزل.',c1:'اكتشف المجموعات',c2:'ابحث عن منتج',prods:'منتجات',gam:'مجموعات',lg:'لغتان',t1:'أربع مجموعات بنفس مستوى الجودة',l1:'كل مجموعة تلبي مهنة محددة. افتح مجموعة للاطلاع على البطاقات التقنية لمنتجاتها.',go:'عرض المجموعة',t2:'كل الكتالوج',ph:'ابحث عن منتج…',all:'جميع المجموعات',empty:'<b>لم يتم العثور على أي منتج</b>جرّب اسمًا أو مجموعة أخرى.',soon:'البطاقة متوفرة قريبًا',t3:'صُنع في الجزائر وشرح مفصّل',a1:'تنتج شركة تريوكس الجزائر المطهرات والمنظفات انطلاقًا من قسنطينة. يجمع هذا الكتالوج البطاقات التقنية لمنتجاتها، مجموعة بعد مجموعة.',a2:'كل بطاقة متوفرة بالفرنسية والعربية، وتُفتح مباشرة من رمز QR الموجود على العبوة.',t4:'سؤال حول منتج؟',a3:'راسلونا أو زوروا موقعنا لأي طلب معلومات.',n:k=>k?k+' '+(k>2&&k<11?'منتجات':'منتج'):'قريبًا',dist:'شركة تريوكس الجيري — إنتاج المواد المطهرة والمنظفة.<br>حي الياسمين، الشطر الثاني دي – أن – سي، طريق عين الباي رقم 118، قسنطينة، الجزائر.<br><span dir="ltr">treox.info@treoxalgerie.com · www.treoxalgerie.com</span>'}};
let L='fr',F='all';
try{L=localStorage.getItem('lang')||((navigator.language||'').startsWith('ar')?'ar':'fr')}catch(e){}
const $=id=>document.getElementById(id),G=s=>GROUPS.find(g=>g.slug===s),count=s=>PRODUCTS.filter(p=>p.g.includes(s)).length;
const set=(id,v)=>{$(id).innerHTML=v};
function draw(){
 const t=T[L],q=$('q').value.trim().toLowerCase();
 const list=PRODUCTS.filter(p=>(F==='all'||p.g.includes(F))&&(!q||(p.name+' '+p.fr+' '+p.ar).toLowerCase().includes(q)));
 $('grid').innerHTML=list.map(p=>{const w=p.name.replace(/^TREOX\s*/,'').split(' ')[0];
  const th=p.img?`<img src="${p.img}" alt="${p.name}" loading="lazy">`:`<b>${w}</b>`;
  const tags=`<span class="tags">${p.g.map(s=>`<img src="img/gamme-${s}.svg" alt="${G(s)[L]}" title="${G(s)[L]}">`).join('')}</span>`;
  return `<a class="prod" href="${p.slug}/" style="--c:${p.c}"><span class="thumb ${p.cut?'cut':''}">${th}</span><span class="info">${tags}<h3>${p.name}</h3><p>${p[L]}</p>${p.soon?`<em class="soon">${t.soon}</em>`:''}</span></a>`}).join('');
 $('empty').style.display=list.length?'none':'block';set('empty',t.empty);
}
function render(){
 const t=T[L];document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
 ['title:h1','sub:sub','c1:c1','c2:c2','t1:t1','l1:l1','t2:t2','t3:t3','a1:a1','a2:a2','t4:t4','a3:a3','dist:dist'].forEach(x=>{const[k,i]=x.split(':');set(i,t[k])});
 $('q').placeholder=t.ph;
 $('nav').innerHTML=GROUPS.map(g=>`<a href="${g.slug}/">${g[L]}</a>`).join('');
 const live=PRODUCTS.filter(p=>!p.soon).length;
 set('facts',`<div><b>${live}</b><span>${t.prods}</span></div><div><b>${GROUPS.length}</b><span>${t.gam}</span></div><div><b>2</b><span>${t.lg}</span></div>`);
 $('shelf').innerHTML=PRODUCTS.filter(p=>p.img&&p.cut&&!p.soon).slice(0,3).map(p=>`<span style="background:${p.c}"><img src="${p.img}" alt=""></span>`).join('');
 $('ranges').innerHTML=GROUPS.map((g,i)=>{
  const ps=PRODUCTS.filter(p=>p.g.includes(g.slug)&&p.img).slice(0,3);
  const vis=ps.length?ps.map(p=>`<span class="${p.cut?'cut':''}" style="background:${p.c}"><img src="${p.img}" alt="" loading="lazy"></span>`).join(''):`<img class="ic" src="img/gamme-${g.slug}.svg" alt="">`;
  return `<section class="range ${i%2?'rev':''}" style="--gc:${g.c}"><div class="wrap"><div class="vis">${vis}</div><div><span class="n">${t.n(count(g.slug))}</span><h3>${g[L]}</h3><p>${g['d'+L]}</p><a class="go" href="${g.slug}/">${t.go}</a></div></div></section>`}).join('');
 $('filters').innerHTML=['all',...GROUPS.filter(g=>count(g.slug)).map(g=>g.slug)].map(s=>`<button data-c="${s}" class="${s===F?'on':''}">${s==='all'?t.all:G(s)[L]}</button>`).join('');
 document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{F=b.dataset.c;render()});
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));draw();
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('lang',L)}catch(e){}render()});
$('q').addEventListener('input',draw);render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
